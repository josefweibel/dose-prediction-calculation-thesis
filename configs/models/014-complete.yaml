data:
  dataset_name: gdphmm-hn-vmat
  img_size: [176, 160]
  train_cache_size: 2048 
  val_on_train: true

batch_size: 64
epochs: 1000

lr_scheduler:
  start_lr: 0.01
  end_lr: 0.0001
  start_decay: 1000
  end_decay: 10000

mixed_precision: false
num_workers: 4
prefetch_factor: 4 
prefetch_on_gpu: true 

beta_1: 0.0001
beta_T: 0.02
T: 1000

grad_clip: 1.0
ema_decay: 0.9999

eval_interval: 1 
checkpoint_interval: 10

validation_sampler: ddpm-1000
