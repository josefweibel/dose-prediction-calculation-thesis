data:
  dataset_name: gdphmm-hn-vmat
  img_size: [176, 160]
  train_cache_size: inf
  valid_cache_size: inf
  valid_limit: 512

batch_size: 32
epochs: 100

lr_scheduler:
  type: cosine_annealing
  lr: 0.0001
  warmup_epochs: 5

c3d:
  use_2d: true
  alpha: 1

mixed_precision: false
num_workers: 4
prefetch_factor: 4
prefetch_on_gpu: false

grad_clip: 1.0
ema_decay: 0.9999

eval_interval: 10
checkpoint_interval: 10

validation_sampler: unet
