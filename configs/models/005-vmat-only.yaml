data:
  dataset_name: gdphmm-hn-vmat
  img_size: [176, 160]

batch_size: 32
lr: 0.01
epochs: 1000

mixed_precision: false
num_workers: 4
prefetch_factor: 2
prefetch_on_gpu: true

beta_1: 0.0001
beta_T: 0.02
T: 1000

grad_clip: 1.0
ema_decay: 0.9999

eval_interval: 2
checkpoint_interval: 2

validation_sampler: ddpm-1000
