data:
  dataset_name: gdphmm-hn-vmat
  img_size: [176, 160]
  train_cache_size: inf
  valid_cache_size: inf
  valid_limit: 512

batch_size: 64
epochs: 200

lr: 0.0001

diffusion:
  beta_1: 0.0001
  beta_T: 0.02
  T: 1000

beamdiff:
  bottleneck_attention: false

conditioning:
  types:
    - ct
    - body
    - ptv_doses
    - ptv_sdm
    - oar_v3_sdm
    - beam_plate
    - angle_plate

mixed_precision: true
num_workers: 4
prefetch_factor: 12
prefetch_on_gpu: true

grad_clip: 0.5
ema_decay: 0.9999

eval_interval: 10
checkpoint_interval: 10

validation_sampler: ddpm-1000
