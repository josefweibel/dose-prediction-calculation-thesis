# Warm-Start Diffusion Phase 1: Train warm-start model h_φ
#
# This config trains a model to predict (μ, σ) from conditioning.
# Uses Gaussian NLL loss: 0.5 * ((x_0 - μ) / σ)² + log(σ)
#
# After training, run evaluation to cache (μ, σ) predictions for Phase 2.

data:
  dataset_name: gdphmm-hn-vmat
  img_size: [176, 160]
  train_cache_size: inf
  valid_cache_size: inf
  valid_limit: 512

batch_size: 128
epochs: 200

lr: 0.0001

warm_start_model:
  min_sigma: 0.01
  loss_type: gaussian_nll_v4
  loss_warmup_epochs: 0

deeplabv3plus:
  separate_heads: true
  var_head_init_bias: -2.0
  decoder_group_norm: true

conditioning:
  types:
    - ct
    - body
    - ptv_doses
    - ptv_sdm
    - oar_v3_sdm

mixed_precision: true
num_workers: 4
prefetch_factor: 12
prefetch_on_gpu: true

grad_clip: 0.5
ema_decay: 0.9999

eval_interval: 10
checkpoint_interval: 10

# Use unet sampler for validation metrics (no caching during training)
# Run warm-start-cache sampler after training to cache (μ, σ) for Phase 2
validation_sampler: warm-start-unet
