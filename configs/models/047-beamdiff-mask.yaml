data:
  dataset_name: gdphmm-hn-vmat
  img_size: [176, 160]
  train_cache_size: inf
  valid_cache_size: inf
  valid_limit: 512
  voxel_spacing: [2.5, 2.5, 2.0]

batch_size: 128
epochs: 200

lr_scheduler:
  type: step_decay
  initial_lr: 0.0001
  step_size: 100
  gamma: 0.1

diffusion:
  beta_1: 0.0001
  beta_T: 0.02
  T: 1000

beamdiff: {}

conditioning:
  types:
    - ct
    - ptv_mask
    - oar_mask

mixed_precision: false
num_workers: 4
prefetch_factor: 4
prefetch_on_gpu: false

grad_clip: 0.5
ema_decay: 0.9999

eval_interval: 10
checkpoint_interval: 10

validation_sampler: ddpm-1000
