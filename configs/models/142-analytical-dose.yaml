data:
  dataset_name: gdphmm-hn-vmat
  img_size: [176, 160]
  train_cache_size: inf
  valid_cache_size: inf
  valid_limit: 512

batch_size: 128
epochs: 1

warm_start_model:
  min_sigma: 0.01

analytical_dose: {}

conditioning:
  types:
    - ct
    - body
    - ptv_doses
    - ptv_sdm
    - oar_v3_sdm

mixed_precision: true
num_workers: 4
prefetch_factor: 12
prefetch_on_gpu: true
