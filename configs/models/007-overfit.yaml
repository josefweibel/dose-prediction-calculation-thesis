data:
  dataset_name: gdphmm-hn-vmat
  img_size: [176, 160]
  train_cache_size: 2048
  train_limit: 1
  val_on_train: true

batch_size: 64
lr: 0.01
epochs: 5000

diffusion:
  beta_1: 0.0001
  beta_T: 0.02
  T: 1000

mixed_precision: false
num_workers: 4
prefetch_factor: 4
prefetch_on_gpu: true

grad_clip: 1.0
ema_decay: 0.9999

eval_interval: 50
checkpoint_interval: 100

validation_sampler: ddpm-1000
