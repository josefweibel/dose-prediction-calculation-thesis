data:
  dataset_name: gdphmm-hn-vmat
  img_size: [176, 160]
  train_cache_size: inf
  valid_cache_size: inf
  valid_limit: 512

batch_size: 128
epochs: 200

lr_scheduler:
  start_lr: 0.0001
  end_lr: 0.00001
  start_decay: 40000
  end_decay: 60000

diffusion:
  beta_1: 0.0001
  beta_T: 0.02
  T: 1000

spdiffdose:
  cross_attention_levels: [3, 4]

conditioning:
  types:
    - ct
    - body
    - ptv_sdm
    - oar_v2_sdm

mixed_precision: false
num_workers: 4
prefetch_factor: 12
prefetch_on_gpu: true

grad_clip: 0.5
ema_decay: 0.9999

eval_interval: 10
checkpoint_interval: 10

validation_sampler: ddpm-1000
