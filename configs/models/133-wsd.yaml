# Warm-Start Diffusion Phase 2: Train diffusion model with warm-start
#
# This config trains a diffusion model on normalized targets using cached warm-start predictions.
# Targets are normalized: X'_0 = (X_0 - μ) / σ_norm
# where σ_norm = w * max(σ, 1-w) + (1-w) and w ~ U[warmth_range]
#
# Prerequisites:
# 1. Train Phase 1 model: python train.py --config configs/models/wsd-warmstart-deeplabv3plus.yaml
# 2. Run evaluation to cache predictions (happens automatically with warm-start-cache sampler)

data:
  dataset_name: gdphmm-hn-vmat
  img_size: [176, 160]
  train_cache_size: inf
  valid_cache_size: inf
  valid_limit: 512

batch_size: 128
epochs: 200

lr: 0.0001

diffusion:
  beta_1: 0.0001
  beta_T: 0.02
  T: 1000

beamdiff: {}

warm_start:
  model: 132-warmstart-deeplabv3plus
  warmth_range: [0.0, 1.0]            # Training: sample w ~ U[range]
  warmth: 1.0                         # Inference: fixed w value (1.0 = full warm-start)
  cache_valid_volumes: true

conditioning:
  types:
    - ct
    - body
    - ptv_doses
    - ptv_sdm
    - oar_v3_sdm

mixed_precision: true
num_workers: 4
prefetch_factor: 12
prefetch_on_gpu: true

validation:
  num_workers: 2
  prefetch_factor: 2
  prefetch_on_gpu: true

grad_clip: 0.5
ema_decay: 0.9999

eval_interval: 10
checkpoint_interval: 10

validation_sampler: ddpm-1000
