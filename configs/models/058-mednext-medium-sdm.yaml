data:
  dataset_name: gdphmm-hn-vmat
  img_size: [176, 160]
  train_cache_size: inf
  valid_cache_size: inf
  valid_limit: 512

batch_size: 128
epochs: 100

lr_scheduler:
  type: cosine_annealing
  lr: 0.0001

mednext:
  id: medium
  kernel_size: 3
  deep_supervision: false

conditioning:
  types:
    - ct
    - ptv_sdm
    - oar_sdm

mixed_precision: false
num_workers: 4
prefetch_factor: 4
prefetch_on_gpu: false

grad_clip: 0.5
ema_decay: 0.9999

eval_interval: 10
checkpoint_interval: 10

validation_sampler: unet
