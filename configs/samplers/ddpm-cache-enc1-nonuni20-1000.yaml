sampler: ddpm
T: 1000
schedule: linear

data_cache_size: inf
num_workers: 4
prefetch_factor: 4
prefetch_on_gpu: false

seed: 1
batch_size_per_gpu: 32
precision: null

cache:
  warmup_steps: 1
  layers:
    - head_struc
    - enc1_struc
    - enc2_struc
    - enc3_struc
    - enc4_struc
    - enc1
    - enc2
    - enc3
    - enc4
  intervals:
    head_struc: inf
    enc1_struc: inf
    enc2_struc: inf
    enc3_struc: inf
    enc4_struc: inf
  c:
    enc1: 120
    enc2: 120
    enc3: 120
    enc4: 120
  p:
    enc1: 1.3
    enc2: 1.3
    enc3: 1.3
    enc4: 1.3
  k:
    enc1: 50
    enc2: 50
    enc3: 50
    enc4: 50

