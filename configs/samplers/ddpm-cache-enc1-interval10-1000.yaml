sampler: ddpm
T: 1000
schedule: linear

data_cache_size: inf
num_workers: 4
prefetch_factor: 4
prefetch_on_gpu: false

seed: 1
batch_size_per_gpu: 16
precision: null

cache:
  warmup_steps: 0
  layers:
    - head_struc
    - enc1_struc
    - enc2_struc
    - enc3_struc
    - enc4_struc
    - enc1
    - enc2
    - enc3
    - enc4
    - dec4
    - dec3
    - dec2
  intervals:
    head_struc: inf
    enc1_struc: inf
    enc2_struc: inf
    enc3_struc: inf
    enc4_struc: inf
    enc1: 10
    enc2: 10
    enc3: 10
    enc4: 10
    dec4: 10
    dec3: 10
    dec2: 10
