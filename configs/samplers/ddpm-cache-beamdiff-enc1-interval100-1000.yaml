sampler: ddpm
T: 1000
schedule: linear

data_cache_size: inf
num_workers: 4
prefetch_factor: 4
prefetch_on_gpu: false

seed: 1
batch_size_per_gpu: 16
precision: null

cache:
  warmup_steps: 0
  layers:
    - head_struct
    - enc1_struct
    - enc2_struct
    - enc3_struct
    - enc4_struct
    - enc5_struct
    - down1_struct
    - down2_struct
    - down3_struct
    - down4_struct
    - down5_struct
    - head_beam
    - enc1_beam
    - enc2_beam
    - enc3_beam
    - enc4_beam
    - enc5_beam
    - down1_beam
    - down2_beam
    - down3_beam
    - down4_beam
    - down5_beam
    - enc1
    - enc2
    - enc3
    - enc4
    - enc5
    - dec5
    - dec4
    - dec3
    - dec2
  intervals:
    head_struct: inf
    enc1_struct: 100
    enc2_struct: 100
    enc3_struct: 100
    enc4_struct: 100
    enc5_struct: 100
    down1_struct: 100
    down2_struct: 100
    down3_struct: 100
    down4_struct: 100
    down5_struct: 100
    head_beam: inf
    enc1_beam: 100
    enc2_beam: 100
    enc3_beam: 100
    enc4_beam: 100
    enc5_beam: 100
    down1_beam: 100
    down2_beam: 100
    down3_beam: 100
    down4_beam: 100
    down5_beam: 100
    enc1: 100
    enc2: 100
    enc3: 100
    enc4: 100
    enc5: 100
    dec5: 100
    dec4: 100
    dec3: 100
    dec2: 100
