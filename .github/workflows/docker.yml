  build-main-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Needed to push to GHCR
      id-token: write   # Optional for some auth setups
    # needs: build-builder
    steps:
      - uses: actions/checkout@v3
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull builder image
        run: docker pull ghcr.io/${{ github.repository_owner }}/dose-prediction-thesis-builder:latest
      - name: Build Docker image
        run: |
          export DOCKER_BUILDKIT=1
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/dose-prediction-thesis:latest
          docker build --rm --force-rm --squash -t $IMAGE_NAME .
      - name: Push Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/dose-prediction-thesis:latest
          docker push $IMAGE_NAME
